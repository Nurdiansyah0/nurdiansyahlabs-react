<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="n-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <linearGradient id="dot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Hexagon Base (Data/Tech vibe) -->
  <polygon points="100,10 178,55 178,145 100,190 22,145 22,55" fill="none" stroke="#334155" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Stylized N Lettermark -->
  <path d="M60,140 L60,60 L140,140 L140,60" fill="none" stroke="url(#n-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Data Nodes -->
  <circle cx="60" cy="60" r="14" fill="url(#dot-grad)" filter="url(#glow)" />
  <circle cx="140" cy="140" r="14" fill="url(#dot-grad)" filter="url(#glow)" />
</svg>
