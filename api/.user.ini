; cPanel PHP Configuration for NurdiansyahLabs Backend
; These settings optimize the memory usage and execution time for API scripts

; Limit memory consumption to a strict ceiling to prevent shared-host crashes
memory_limit = 256M

; Set max execution time (auto-post trends might take time to scrape)
max_execution_time = 60

; Ensure error logging is quiet but written to a file for debugging
display_errors = Off
log_errors = On
error_log = error_log

; Upload limits (if later required for gallery, but keep minimal for now)
upload_max_filesize = 10M
post_max_size = 12M
